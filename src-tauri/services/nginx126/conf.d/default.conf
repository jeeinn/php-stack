# php-stack: 默认站点 —— 默认欢迎页。
# 工作区的 ./www 挂载到容器 /www；与站点托管 conf 共存。
#
# 本文件用 default_server + server_name _ 兜底，不会与站点域名冲突，
# 未匹配到站点域名的请求会回落到欢迎页。
#
# PHP 转发使用短别名 `php`（单实例时 compose 会挂该别名）。
# 若配置了多个 PHP，短别名不可用，请改成实际容器名，如 ps-php82:9000。

server {
    listen 80 default_server;
    server_name _;

    root /www;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
