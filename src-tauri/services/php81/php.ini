; PHP configuration for PHP-Stack
[PHP]
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
opcache.enable = 1
opcache.memory_consumption = 128
date.timezone = Asia/Shanghai
; Off for FPM/CGI so query string does not populate argv (CLI stays On)
register_argc_argv = Off
